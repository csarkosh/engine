name: test

# The same gates as `npm run typecheck && npm run lint && npm run test:tools && npm run test:empty
# && npm run test:server && npm test`, split into jobs so each one reports on its own, a build of
# the empty game, and a pack of the server's tarball. The
# commands are package.json's, so a local run and this one test the same thing, with two
# differences, both because the runners are shared machines slower than a development one: every
# test time limit is scaled (TEST_TIME_SCALE), and the tests tagged `wall-clock`, whose assertion
# is a bar on elapsed time, are left out here. The workflow answers pass or fail, and no time
# measured here means anything about the engine's performance.
#
# Started by hand only: runner minutes cost time and money, so nothing runs that nobody asked
# for. No push, no pull request starts it; run it on purpose, `gh workflow run test.yml --ref
# <branch>`, when a clean checkout is the point (a change to the build or to the lockfile).

on:
  workflow_dispatch:

# One run per ref: a second dispatch on the same branch cancels the first, whose result nobody
# will read.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Read the repository and nothing else: no job writes to it, and none needs a secret, so a pull
# request from a fork runs exactly what a push does.
permissions:
  contents: read

env:
  # The 22.x line the development machine runs: the first with the Brotli fix
  # (CVE-2026-111497), the floor package.json's engines sets for 22.x.
  NODE_VERSION: 22.23.4

jobs:
  # The shipped models, textures and sounds are Git LFS objects and the engine's suite reads the
  # models. LFS bandwidth on the account is capped per month, so the objects come from the
  # Actions cache, keyed on the object ids themselves: they are downloaded from LFS once per new
  # set of ids, never per run. This job fills the cache on a miss; on a hit it only looks the key
  # up. Doing it once here, before the jobs that read the files start, keeps a cold run to ONE
  # download.
  lfs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      # lfs: false leaves pointer files in the tree; nothing is downloaded yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - id: key
        name: key the cache on the lfs object ids
        # Only the ids (column 1): the second column is `*` or `-` depending on
        # whether the file is checked out, so hashing whole lines would change
        # the key between a cold and a warm tree.
        run: echo "key=lfs-v1-$(git lfs ls-files -l | cut -d' ' -f1 | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs/objects
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      # The only step in the workflow that can reach LFS, and it runs only on a miss. `fetch` is
      # the download half of `pull`: this job needs the objects in .git/lfs/objects for the
      # cache, not the files in the tree.
      - name: download lfs objects (cache miss only)
        if: steps.lookup.outputs.cache-hit != 'true'
        run: git lfs fetch
      # A cache entry cannot be overwritten, so a bad one would stick: check every object's hash
      # before saving, and save nothing if one is wrong.
      - name: verify lfs objects before saving (cache miss only)
        if: steps.lookup.outputs.cache-hit != 'true'
        run: git lfs fsck --objects
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs/objects
          key: ${{ steps.key.outputs.key }}

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # typecheck and lint read no LFS object, so this job skips them entirely.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: install
        run: npm ci
      - run: npm run typecheck
      # Lint runs even when typecheck fails, so one run reports both.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

  tools-and-empty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Neither suite reads an LFS object.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: install
        run: npm ci
      - run: npm run test:tools
      # The empty game on the engine alone: its world, its rules and two peers through the
      # engine's sessions. It makes its world from a seed and reads no shipped file.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:empty

  # The engine's own suite (`test/`), whole on one runner and not sharded. It reads the engine's
  # shipped models, which are LFS objects, so it restores them from the cache the lfs job fills.
  # Time limits scaled and `wall-clock` tests left out.
  engine:
    needs: lfs
    runs-on: ubuntu-latest
    # The longest scaled limit on top of the suite's own time, plus a margin, so a test that hangs
    # while awaiting is still reported by vitest, naming it. vitest's limit is a timer, which
    # cannot fire while synchronous code runs: a synchronous endless loop ends here instead, and
    # this timeout names only the job.
    timeout-minutes: 40
    env:
      # Every test time limit, and vitest's defaults, times three: the smallest whole factor that
      # keeps every test measured on these runners under two thirds of its scaled limit.
      TEST_TIME_SCALE: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs/objects
          key: ${{ needs.lfs.outputs.key }}
          fail-on-cache-miss: true
      # `git lfs checkout` writes the files from .git/lfs/objects and never goes
      # to the network. A bad object, or any file still a pointer afterwards,
      # means the cache entry is bad: fail here, naming the files and the way
      # out, not in whichever test reads them. `git lfs ls-files -l` prints
      # `<64-hex oid> <*|-> <path>`, `-` for a pointer, so the match is anchored
      # on the oid and a path containing " - " cannot pass for one.
      - name: check out lfs files from the cache
        env:
          KEY: ${{ needs.lfs.outputs.key }}
        run: |
          pointers() { git lfs ls-files -l | grep -E '^[0-9a-f]{64} - ' || true; }
          bad() {
            echo "::error::The cached LFS objects under $KEY are incomplete or corrupt, and a cache entry cannot be overwritten. Delete it with: gh cache delete $KEY --repo ${GITHUB_REPOSITORY}  (or change lfs-v1 to lfs-v2 in this workflow), then re-run ALL jobs (gh run rerun ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY}, not --failed; the lfs job must run again to refill the cache)."
            exit 1
          }
          echo "lfs pointers before checkout: $(pointers | grep -c . || true)"
          git lfs fsck --objects || bad
          git lfs checkout
          missing=$(pointers)
          echo "lfs pointers after checkout: $(printf '%s' "$missing" | grep -c . || true)"
          if [ -n "$missing" ]; then echo "$missing"; bad; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vitest run '--tags-filter=!wall-clock'

  # The server package (`server/`, released as `csarkosh-engine-server-<version>.tgz`): its tests,
  # and a pack of its tarball, which compiles it first (`prepack`), so a build that does not compile
  # fails here and not at a release. It reads no LFS object and imports nothing of the engine.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: install
        run: npm ci
      - run: npm run test:server
      # Packed even where the tests failed, so one run reports both.
      - name: pack the server tarball
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: server
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/csarkosh-engine-server-*.tgz

  # The empty game, built as a game builds its page. The suites build only fixtures; this is the
  # one place the real build runs. It imports the engine's shipped models and textures, so it
  # restores them as the engine job does.
  build:
    needs: lfs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs/objects
          key: ${{ needs.lfs.outputs.key }}
          fail-on-cache-miss: true
      # `git lfs checkout` writes the files from .git/lfs/objects and never goes
      # to the network. A bad object, or any file still a pointer afterwards,
      # means the cache entry is bad: fail here, naming the files and the way
      # out, not in whichever test reads them. `git lfs ls-files -l` prints
      # `<64-hex oid> <*|-> <path>`, `-` for a pointer, so the match is anchored
      # on the oid and a path containing " - " cannot pass for one.
      - name: check out lfs files from the cache
        env:
          KEY: ${{ needs.lfs.outputs.key }}
        run: |
          pointers() { git lfs ls-files -l | grep -E '^[0-9a-f]{64} - ' || true; }
          bad() {
            echo "::error::The cached LFS objects under $KEY are incomplete or corrupt, and a cache entry cannot be overwritten. Delete it with: gh cache delete $KEY --repo ${GITHUB_REPOSITORY}  (or change lfs-v1 to lfs-v2 in this workflow), then re-run ALL jobs (gh run rerun ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY}, not --failed; the lfs job must run again to refill the cache)."
            exit 1
          }
          echo "lfs pointers before checkout: $(pointers | grep -c . || true)"
          git lfs fsck --objects || bad
          git lfs checkout
          missing=$(pointers)
          echo "lfs pointers after checkout: $(printf '%s' "$missing" | grep -c . || true)"
          if [ -n "$missing" ]; then echo "$missing"; bad; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: build the empty game
        run: npm run build:empty

  # The one status to require and to read: it fails unless every job above succeeded.
  # `always()` matters: a job skipped because its dependency failed would otherwise skip this one
  # too, and a skipped check reads as passing. It also runs on a run cancelled by a newer
  # dispatch, and fails there: a red `gates` on a superseded run is that cancellation, not a
  # failure to chase.
  gates:
    if: always()
    needs: [lfs, static, tools-and-empty, server, engine, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
